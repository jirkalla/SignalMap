{% extends "base.html" %}
{% block title %}{{ status_code }} · {{ t('app.title') }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 text-center">
  <p class="text-sm font-mono text-stone-400 mb-2">{{ status_code }}</p>
  <h1 class="text-xl font-semibold mb-4">{{ message }}</h1>
  <a href="/clients" class="text-stone-600 hover:underline text-sm">{{ t('errors.back_to_clients') }}</a>
</div>
{% endblock %}
