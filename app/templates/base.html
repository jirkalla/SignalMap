<!DOCTYPE html>
<html lang="{{ locale }}" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ t('app.title') }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {% block head %}{% endblock %}
</head>
<body class="h-full min-h-screen bg-stone-50 text-stone-900 font-sans antialiased">
  <header class="border-b border-stone-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <a href="/clients" class="flex items-center gap-2">
        <span class="text-lg font-semibold tracking-tight">{{ t('app.title') }}</span>
      </a>
      <nav class="flex items-center gap-4 text-sm">
        <a href="/clients" class="text-stone-600 hover:text-stone-900">{{ t('nav.clients') }}</a>

        <div class="relative">
          <button type="button" class="nav-dd-trigger flex items-center gap-1 text-stone-600 hover:text-stone-900" data-dd-target="nav-config-menu" aria-expanded="false" aria-haspopup="true">
            {{ t('nav.config_menu') }}
            <svg class="w-2.5 h-2.5" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="nav-config-menu" class="nav-dd-panel hidden absolute top-full left-1/2 -translate-x-1/2 mt-2 min-w-[160px] bg-white border border-stone-300 rounded-md shadow-md p-1 z-10">
            <a href="/markets" class="block px-3 py-2 rounded text-stone-600 hover:bg-stone-50 hover:text-stone-900">{{ t('nav.markets') }}</a>
            <a href="/providers" class="block px-3 py-2 rounded text-stone-600 hover:bg-stone-50 hover:text-stone-900">{{ t('nav.providers') }}</a>
            <a href="/ai-models" class="block px-3 py-2 rounded text-stone-600 hover:bg-stone-50 hover:text-stone-900">{{ t('nav.ai_models') }}</a>
            <a href="/settings" class="block px-3 py-2 rounded text-stone-600 hover:bg-stone-50 hover:text-stone-900">{{ t('nav.settings') }}</a>
          </div>
        </div>

        <div class="relative">
          <button type="button" class="nav-dd-trigger flex items-center gap-1 text-stone-600 hover:text-stone-900" data-dd-target="nav-help-menu" aria-expanded="false" aria-haspopup="true">
            {{ t('nav.help_menu') }}
            <svg class="w-2.5 h-2.5" viewBox="0 0 10 6" fill="none" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="nav-help-menu" class="nav-dd-panel hidden absolute top-full left-1/2 -translate-x-1/2 mt-2 min-w-[160px] bg-white border border-stone-300 rounded-md shadow-md p-1 z-10">
            <a href="/help" class="block px-3 py-2 rounded text-stone-600 hover:bg-stone-50 hover:text-stone-900">{{ t('nav.help') }}</a>
            <a href="/findings" class="block px-3 py-2 rounded text-stone-600 hover:bg-stone-50 hover:text-stone-900" title="English-only technical log">Findings</a>
            <a href="/docs" class="block px-3 py-2 rounded text-stone-600 hover:bg-stone-50 hover:text-stone-900">{{ t('nav.docs') }}</a>
          </div>
        </div>

        <span class="flex items-center gap-1 text-stone-400">
          <a href="/set-locale/en?next={{ request.url.path }}" class="hover:text-stone-900 {% if locale == 'en' %}font-semibold text-stone-900{% endif %}">EN</a>
          <span>/</span>
          <a href="/set-locale/de?next={{ request.url.path }}" class="hover:text-stone-900 {% if locale == 'de' %}font-semibold text-stone-900{% endif %}">DE</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Delegated confirm() guard for every delete form — see the
    // signalmap-conventions skill's "delete action" rule. Reads the
    // message from data-confirm (normal HTML-escaped attribute) instead
    // of interpolating translated text into an inline onsubmit string,
    // which breaks on any apostrophe in the message (e.g. English "can't").
    document.addEventListener('submit', function (event) {
      var message = event.target.getAttribute('data-confirm');
      if (message && !window.confirm(message)) {
        event.preventDefault();
      }
    });

    // Nav "Configuration"/"Help" dropdowns: click to open (not hover — needs
    // to work on touch), one open at a time, closes on outside click or Esc.
    document.addEventListener('click', function (event) {
      var trigger = event.target.closest('.nav-dd-trigger');
      document.querySelectorAll('.nav-dd-panel').forEach(function (panel) {
        var isThisTriggersPanel = trigger && panel.id === trigger.getAttribute('data-dd-target');
        var shouldOpen = isThisTriggersPanel && panel.classList.contains('hidden');
        panel.classList.toggle('hidden', !shouldOpen);
      });
      document.querySelectorAll('.nav-dd-trigger').forEach(function (btn) {
        var panel = document.getElementById(btn.getAttribute('data-dd-target'));
        btn.setAttribute('aria-expanded', panel && !panel.classList.contains('hidden') ? 'true' : 'false');
      });
    });
    document.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;
      document.querySelectorAll('.nav-dd-panel').forEach(function (panel) { panel.classList.add('hidden'); });
      document.querySelectorAll('.nav-dd-trigger').forEach(function (btn) { btn.setAttribute('aria-expanded', 'false'); });
    });
  </script>
</body>
</html>
