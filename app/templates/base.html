<!DOCTYPE html>
<html lang="{{ locale }}" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ t('app.title') }}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans"', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {% block head %}{% endblock %}
</head>
<body class="h-full min-h-screen bg-stone-50 text-stone-900 font-sans antialiased">
  <header class="border-b border-stone-200 bg-white">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <a href="/clients" class="flex items-center gap-2">
        <span class="text-lg font-semibold tracking-tight">{{ t('app.title') }}</span>
      </a>
      <nav class="flex items-center gap-4 text-sm">
        <a href="/clients" class="text-stone-600 hover:text-stone-900">{{ t('nav.clients') }}</a>
        <a href="/markets" class="text-stone-600 hover:text-stone-900">{{ t('nav.markets') }}</a>
        <a href="/help" class="text-stone-600 hover:text-stone-900">{{ t('nav.help') }}</a>
        <a href="/docs" class="text-stone-600 hover:text-stone-900">{{ t('nav.docs') }}</a>
        <span class="flex items-center gap-1 text-stone-400">
          <a href="/set-locale/en?next={{ request.url.path }}" class="hover:text-stone-900 {% if locale == 'en' %}font-semibold text-stone-900{% endif %}">EN</a>
          <span>/</span>
          <a href="/set-locale/de?next={{ request.url.path }}" class="hover:text-stone-900 {% if locale == 'de' %}font-semibold text-stone-900{% endif %}">DE</a>
        </span>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
