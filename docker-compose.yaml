name: signalmap

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: signalmap
      POSTGRES_USER: signalmap_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 stores its versioned data directory beneath this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

  app:
    image: signalmap-app
    build:
      context: .
      dockerfile: dockerfile
      # Baked into the image as ENV (dockerfile), shown in the footer to logged-in users
      # (docs/TASKS_VERSIONING.md VER-T2). Empty when the shell doesn't set them — a normal dev
      # build; the app starts fine and the footer just omits them.
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Generate a hex password as documented; no URL escaping is then needed.
      DATABASE_URL: postgresql+psycopg://signalmap_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/signalmap
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_NAME: ${DEV_ADMIN_NAME:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
      # Read by app/services/run_execution.py's check_daily_quota (docs/TASKS_SCHEDULER.md T10) —
      # needed here too, not just on `worker` below, since a manual trigger (this service) must
      # enforce the exact same cap the scheduler does (design decision 26).
      SCHEDULER_DEFAULT_DAILY_RUN_LIMIT: ${SCHEDULER_DEFAULT_DAILY_RUN_LIMIT:-50}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    logging: *logging

  # Scheduler ticker + executor (docs/TASKS_SCHEDULER.md T3/T4) — same image as `app`, no build
  # of its own, so the two containers can never run different code. Never runs `alembic upgrade
  # head`: the `app` service's own CMD already does, and two containers migrating the same
  # database at once would race for the migration lock; `depends_on: app: condition:
  # service_healthy` guarantees migrations have already finished by the time this starts.
  worker:
    image: signalmap-app
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://signalmap_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/signalmap
      # Required even though the worker issues no cookies of its own: app/config.py's
      # `secret_key` has no default, so any `get_settings()` call (unavoidable importing
      # app.database) fails at startup without it.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_DRY_RUN: ${SCHEDULER_DRY_RUN:-true}
      SCHEDULER_GRACE_PERIOD_MINUTES: ${SCHEDULER_GRACE_PERIOD_MINUTES:-360}
      SCHEDULER_LEASE_MINUTES: ${SCHEDULER_LEASE_MINUTES:-15}
      SCHEDULER_DEFAULT_DAILY_RUN_LIMIT: ${SCHEDULER_DEFAULT_DAILY_RUN_LIMIT:-50}
      SCHEDULER_MAX_QUEUE_DEPTH_PER_CLIENT: ${SCHEDULER_MAX_QUEUE_DEPTH_PER_CLIENT:-500}
      SCHEDULER_PROVIDER_CONCURRENCY: ${SCHEDULER_PROVIDER_CONCURRENCY:-1}
      # No `:-default` fallback here, deliberately (docs/TASKS_SCHEDULER.md T10) — a bare `KEY:`
      # passes the host's own WORKER_NAME through only if it's actually set there, otherwise the
      # container gets no WORKER_NAME env var at all, and app/config.py's own default (the
      # container's own hostname) applies. A `${WORKER_NAME:-scheduler-1}`-style fallback would
      # set the SAME literal value in every `docker compose up --scale worker=N` replica, breaking
      # the one-heartbeat-row-per-worker identity this is meant to give for free.
      WORKER_NAME:
      # No GIT_SHA/BUILD_TIME here, unlike the API keys above: they're baked into the shared
      # signalmap-app image as ENV at build time, so this service inherits whatever that image
      # was built with (docs/TASKS_VERSIONING.md decision 8) — which is only the current commit
      # right after a docs/DEPLOYMENT.md-style deploy. The periodic maintenance rebuild in
      # README.md's "day-to-day commands" (`docker compose build --pull app`) does not pass
      # these args, so it silently re-bakes both as empty; the footer then just omits the SHA/
      # build-time until the next real deploy (found in code review, 2026-09-23 — cosmetic only,
      # app/config.py's empty defaults mean this never fails startup).
    # No HTTP port to probe (design decision 19) — checks that app/worker.py's main loop is
    # still touching its liveness file, written on every iteration (~every 5s). 30s = 6x that
    # interval, so one slow iteration doesn't flap the container between healthy/unhealthy.
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import os, sys, time; sys.exit(0 if os.path.exists('/tmp/worker-alive') and time.time() - os.path.getmtime('/tmp/worker-alive') < 30 else 1)",
      ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # A provider call takes 5-28s observed (app/routers/runs.py's trigger_run docstring); the
    # worker's SIGTERM handler (app/worker.py) finishes whatever item it's mid-processing before
    # exiting, so this must comfortably outlast the slowest observed call plus its own overhead.
    stop_grace_period: 120s
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-58000}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-58443}:443"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - type: bind
        source: /var/lib/signalmap/maintenance
        target: /srv
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

configs:
  caddyfile:
    content: |
      ${SITE_ADDRESS:-:80} {
        encode gzip

        root * /srv
        @maintenance file /maintenance.on
        handle @maintenance {
          header Retry-After 300
          rewrite * /index.html
          file_server {
            status 503
          }
        }

        handle {
          reverse_proxy app:8000
        }
      }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
