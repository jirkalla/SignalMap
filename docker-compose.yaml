services:
  postgres:
    image: postgres:18
    container_name: signalmap_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: signalmap
      POSTGRES_USER: signalmap_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "55432:5432"        # host:container
    volumes:
      # postgres:18+ images store the cluster under a version-specific
      # subdirectory of /var/lib/postgresql itself, not .../data directly —
      # mounting at .../data (the pre-18 convention) fails at startup.
      - pgdata:/var/lib/postgresql

  app:
    build: .
    container_name: signalmap_app
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    ports:
      - "58000:8000"         # host:container
    volumes:
      - .:/code
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata: